name: Container

on:
  push:
    branches: [main]
    tags: ['v*']
    paths: &build-paths
      - 'Private/**'
      - 'Public/**'
      - '*.psd1'
      - '*.psm1'
      - 'examples/**'
      - 'tools/**'
      - 'Containerfile'
      - '.dockerignore'
      - '.github/workflows/container.yml'
      - '!**/*.md'
  pull_request:
    paths: *build-paths

  workflow_dispatch:
    inputs:
      push:
        description: 'Push the image to GHCR (otherwise build and smoke test only)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ghcr-powerospf
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/powerospf

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Build and smoke test (amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Containerfile
          load: true
          tags: powerospf:test

      - name: Smoke test
        run: |
          docker run --rm --entrypoint pwsh powerospf:test -NoProfile -Command \
            "Import-Module PowerOSPF; if (-not (Get-Command -Module PowerOSPF)) { exit 1 }; (Get-Module PowerOSPF).Version.ToString()"

      - name: Log in to GHCR
        if: github.event_name == 'push' || inputs.push
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags
        if: github.event_name != 'pull_request'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}
            type=raw,value=dispatch,enable=${{ github.event_name == 'workflow_dispatch' && github.ref_type != 'tag' }}
            type=raw,value=nightly,enable=${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
            type=raw,value=nightly-{{date 'YYYYMMDDHHmmss' tz='UTC'}},enable=${{ github.ref_type != 'tag' && github.event_name != 'pull_request' }}
            type=sha,format=long,enable=${{ github.ref_type != 'tag' && github.event_name != 'pull_request' }}
          labels: |
            org.opencontainers.image.description=PowerOSPF in a PowerShell container. Lab use only.

      - name: Build and push (amd64, arm64)
        if: github.event_name == 'push' || inputs.push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Containerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
